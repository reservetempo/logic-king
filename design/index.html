<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>The Architect</title>
  <meta name="description" content="Design document for The Architect, a 2.5D game where the player is God and logic gates are monks, priests and high priests who carry, weigh and overturn torches.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="doc" class="leaf" aria-busy="true">
  <noscript>
    <p class="fallback">This page needs JavaScript to set the design notes. <a href="design.md">Read design.md</a> as plain text instead.</p>
  </noscript>
</main>
<script type="module">
  // The words live in design.md; this page fetches them and renders the markdown.
  const MARKED = 'https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js';

  // Modules that need the rendered doc (for example './viewer.js'). They load,
  // in order, once the markdown is in the page and the headings have their ids.
  const ADDONS = [];

  const doc = document.getElementById('doc');

  // GitHub-style heading slugs ("The Architect’s View" -> "the-architects-view";
  // repeats get -1, -2, ...), so the same #links work here and on github.com.
  function slugger() {
    const seen = new Map();
    return (text) => {
      const base = text.toLowerCase().trim()
        .replace(/[^\p{L}\p{M}\p{N}\p{Pc}\- ]/gu, '')
        .replace(/ /g, '-');
      let slug = base;
      while (seen.has(slug)) {
        seen.set(base, seen.get(base) + 1);
        slug = `${base}-${seen.get(base)}`;
      }
      seen.set(slug, 0);
      return slug;
    };
  }

  function enhance(root) {
    const slug = slugger();
    for (const h of root.querySelectorAll('h1, h2, h3, h4, h5, h6')) {
      h.id = slug(h.textContent);
    }
    // Truth tables: mark each cell lit or dark for the torch glyph.
    for (const td of root.querySelectorAll('td')) {
      const v = td.textContent.trim();
      if (v.startsWith('1')) td.classList.add('lit');
      else if (v.startsWith('0')) td.classList.add('dark');
    }
  }

  function scrollToHash() {
    if (!location.hash) return;
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) target.scrollIntoView();
  }

  function fail(err) {
    console.error(err);
    doc.removeAttribute('aria-busy');
    doc.innerHTML = '<p class="fallback">The design notes could not be set here. <a href="design.md">Read design.md</a> as plain text instead.</p>';
  }

  async function render() {
    const [{ marked }, res] = await Promise.all([
      import(MARKED),
      fetch('design.md', { cache: 'no-cache' }),
    ]);
    if (!res.ok) throw new Error(`design.md: HTTP ${res.status}`);
    doc.innerHTML = marked.parse(await res.text());
    enhance(doc);
    doc.removeAttribute('aria-busy');
    scrollToHash();
    document.dispatchEvent(new CustomEvent('doc:rendered', { detail: { root: doc } }));
    for (const src of ADDONS) {
      try { await import(src); } catch (err) { console.error(`Could not load ${src}`, err); }
    }
  }

  render().catch(fail);
</script>
</body>
</html>
